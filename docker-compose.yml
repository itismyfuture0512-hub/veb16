services:
  db:
    image: postgres:16-alpine
    container_name: todo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todo}
      POSTGRES_USER: ${POSTGRES_USER:-todo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo_pass}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo_user} -d ${POSTGRES_DB:-todo}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [todo-net]

  web-service:
    build:
      context: ./web-service
    container_name: todo-web-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: priority-service
      WORKDAY_HOURS: "8"
      HORIZON_DAYS: "30"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [todo-net]

  backend:
    build:
      context: ./backend
    container_name: todo-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-todo_user}:${POSTGRES_PASSWORD:-todo_pass}@db:5432/${POSTGRES_DB:-todo}
      WEB_SERVICE_URL: http://web-service:8000
      WEB_SERVICE_TIMEOUT: "10"
    depends_on:
      db:
        condition: service_healthy
      web-service:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [todo-net]

  frontend:
    build:
      context: ./frontend
    container_name: todo-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks: [todo-net]

volumes:
  db_data:

networks:
  todo-net:
    driver: bridge